
# HEYBIO ↗ — DIPO LABS
#
# Local Supabase development.
# Production is configured separately
# through your hosted Supabase project.

project_id = "heybio-local"

[api]
enabled = true
port = 54321
schemas = [
  "public",
  "graphql_public"
]
extra_search_path = [
  "public",
  "extensions"
]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

# Enable only after reviewing the
# development-only seed fixtures.
sql_paths = [
  "./seeds/plans.sql",
  "./seeds/templates.sql"
]

[auth]
enabled = true
site_url = "http://localhost:5173"

additional_redirect_urls = [
  "http://localhost:5173/auth/callback"
]

jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"